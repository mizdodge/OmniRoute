name: Inspect OmniRoute Upstream Merge
on:
  push:
    branches:
      - sync/upstream-v3.8.52-from-v3.8.51
    paths:
      - .github/workflows/sync-upstream-merge-inspect.yml
permissions:
  contents: read
  issues: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Inspect real git merge without changing repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          git remote add omniroute-upstream https://github.com/diegosouzapw/OmniRoute.git
          git -c protocol.version=2 fetch --no-tags --filter=blob:none omniroute-upstream release/v3.8.52
          git merge --no-commit --no-ff omniroute-upstream/release/v3.8.52 > /tmp/sync-merge.log 2>&1
          result=$?
          echo "Git merge exit code: $result"
          cat /tmp/sync-merge.log | tail -100
          git ls-files -u | cut -f2 | sort -u > /tmp/sync-unmerged.txt
          echo "Unmerged paths:"
          cat /tmp/sync-unmerged.txt
          echo "Unmerged count: $(wc -l < /tmp/sync-unmerged.txt)"
          {
            echo "## Integration merge simulation"
            echo "- Base: codex/v3.8.51"
            echo "- Upstream: release/v3.8.52"
            echo "- Git merge exit: $result"
            echo "- Unmerged paths: $(wc -l < /tmp/sync-unmerged.txt)"
            echo ""
            echo "### Unmerged paths"
            echo '~~~'
            cat /tmp/sync-unmerged.txt
            echo '~~~'
            echo "### Merge output (last 70 lines)"
            echo '~~~'
            tail -70 /tmp/sync-merge.log
            echo '~~~'
          } > /tmp/sync-summary.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sync-summary.txt')
          s=p.read_text()
          if len(s)>52000: s=s[:52000]+'\n... truncated'
          import json
          Path('/tmp/sync-payload.json').write_text(json.dumps({"body":s}))
          PY
          gh api --method POST repos/mizdodge/OmniRoute/issues/2/comments --input /tmp/sync-payload.json >/dev/null || true
          cat /tmp/sync-summary.txt >> "$GITHUB_STEP_SUMMARY"
          git merge --abort 2>/dev/null || true
          exit 0
